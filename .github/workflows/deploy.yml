name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  deployments: write

jobs:
  deploy:
    name: Deploy TalentSync to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install git if not already installed
            which git || sudo yum install -y git

            # Backup db.php if it exists (it's not in git repo)
            if [ -f /var/www/html/talentsync/config/db.php ]; then
              cp /var/www/html/talentsync/config/db.php /tmp/db.php.bak
              echo "db.php backed up"
            else
              echo "WARNING: No db.php found to backup"
            fi

            # Backup ai.php if it exists (it's not in git repo)
            if [ -f /var/www/html/talentsync/config/ai.php ]; then
              cp /var/www/html/talentsync/config/ai.php /tmp/ai.php.bak
              echo "ai.php backed up"
            else
              echo "WARNING: No ai.php found to backup"
            fi

            # Clean temp directory
            rm -rf /tmp/talentsync-deploy

            # Clone latest code from GitHub
            git clone --depth 1 https://github.com/Krats05/talentsync.git /tmp/talentsync-deploy

            # Verify clone succeeded before deleting old site
            if [ ! -d /tmp/talentsync-deploy ]; then
              echo "ERROR: Git clone failed! Aborting deployment."
              exit 1
            fi

            # Copy to Apache web root
            sudo rm -rf /var/www/html/talentsync
            sudo cp -r /tmp/talentsync-deploy /var/www/html/talentsync

            # Restore db.php from backup
            if [ -f /tmp/db.php.bak ]; then
              sudo cp /tmp/db.php.bak /var/www/html/talentsync/config/db.php
              echo "db.php restored"
            fi

            # Restore ai.php from backup
            if [ -f /tmp/ai.php.bak ]; then
              sudo cp /tmp/ai.php.bak /var/www/html/talentsync/config/ai.php
              echo "ai.php restored"
            fi

            # Set correct permissions
            sudo chown -R apache:apache /var/www/html/talentsync

            # Cleanup
            rm -rf /tmp/talentsync-deploy

            echo "Deployment complete!"

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          environment-url: http://13.59.20.157/talentsync/
          initial-status: success
